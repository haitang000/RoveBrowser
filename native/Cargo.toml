[package]
name = "rove"
version = "0.1.0-beta6"
edition = "2021"
license = "Apache-2.0"

[dependencies]
winit = "0.30"
wry = "0.57.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
csv = "1.3"
winreg = "0.56"
uuid = { version = "1", features = ["v4"] }
url = "2"
include_dir = "0.7"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
directories = "6"
webview2-com = "0.39"
windows = { version = "0.62", features = ["System", "Foundation", "Graphics_Effects", "UI_Composition_Desktop", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }

windows-core = "0.62"

[build-dependencies]
# Compiles the icon resource. The image crate resizes the source PNG into the .ico.
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
