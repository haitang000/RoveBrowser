[package]
name = "rove"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
winit = "0.30"
wry = "0.57.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
include_dir = "0.7"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
directories = "6"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Networking_WinHttp"] }

[profile.release]
lto = "thin"
strip = true
