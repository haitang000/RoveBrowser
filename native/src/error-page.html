<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>无法打开网页</title>
  <style>
    :root { color-scheme: light; color: #000; background: #fff; font-family: system-ui, "Segoe UI", sans-serif; }
    :root[data-theme="dark"] { color-scheme: dark; color: #fff; background: #000; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 28px; }
    main { width: 100%; max-width: 420px; }
    h1 { margin: 0 0 16px; font-size: 26px; font-weight: 500; line-height: 1.4; letter-spacing: -.02em; }
    p { margin: 0; font-size: 14px; line-height: 1.8; }
    #address { margin-top: 20px; overflow-wrap: anywhere; unicode-bidi: plaintext; }
    #code { margin-top: 6px; font: 11px/1.8 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    button { margin-top: 32px; padding: 10px 18px; border: 1px solid currentColor; border-radius: 0; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: #000; color: #fff; border-color: #000; }
    :root[data-theme="dark"] button:hover { background: #fff; color: #000; border-color: #fff; }
    button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (max-width: 360px) { body { padding: 28px 20px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <main aria-labelledby="heading">
    <h1 id="heading">无法打开网页</h1>
    <p id="description"></p>
    <p id="address" dir="auto"></p>
    <p id="code"></p>
    <button type="button" id="retry">重新加载</button>
  </main>
</body>
</html>
