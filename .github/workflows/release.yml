name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend and release executable
        run: npm run native:build
        env:
          CARGO_TERM_COLOR: always

      - name: Package portable zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Upload zip to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release -Filter *.zip)
          if ($archives.Count -ne 1) {
            throw "Expected one release zip, found $($archives.Count)."
          }
          if ($archives[0].Length -le 0) {
            throw "Release zip is empty: $($archives[0].FullName)"
          }
          gh release upload $env:RELEASE_TAG $archives[0].FullName --clobber
