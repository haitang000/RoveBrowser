name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer and portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      installer: ${{ steps.publish.outputs.installer }}
      archive: ${{ steps.publish.outputs.archive }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        # Keep release builds on the compiler used for native/installer validation.
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          $archive = "$toolRoot.zip"
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $archive
          $expectedHash = 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup package checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot -Force
          $compiler = Join-Path $toolRoot 'tools\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe not found.' }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run installer
        env:
          CARGO_TERM_COLOR: always

      - name: Package portable zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ExecutablePath native/target/x86_64-pc-windows-msvc/release/rove.exe

      - name: Upload installer and zip to the GitHub Release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release -Filter *.zip)
          $installers = @(Get-ChildItem -LiteralPath release -Filter *-setup.exe)
          if ($archives.Count -ne 1 -or $installers.Count -ne 1) {
            throw "Expected one zip and one installer, found $($archives.Count) and $($installers.Count)."
          }
          foreach ($artifact in @($archives[0], $installers[0])) {
            if ($artifact.Length -le 0) { throw "Release artifact is empty: $($artifact.FullName)" }
          }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package.json.' }
          $checksums = Join-Path release 'SHA256SUMS.txt'
          @($archives[0], $installers[0]) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath $checksums -Encoding ascii
          gh release upload $env:RELEASE_TAG $archives[0].FullName $installers[0].FullName $checksums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          "installer=$($installers[0].Name)" >> $env:GITHUB_OUTPUT
          "archive=$($archives[0].Name)" >> $env:GITHUB_OUTPUT

  drive:
    name: Back up release assets to Google Drive
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: google-drive-release-backup
      queue: max
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download and verify the published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALLER: ${{ needs.windows.outputs.installer }}
          ARCHIVE: ${{ needs.windows.outputs.archive }}
        run: |
          assets_dir="$RUNNER_TEMP/release-assets"
          gh release download --dir "$assets_dir" \
            --pattern "$INSTALLER" --pattern "$ARCHIVE" --pattern SHA256SUMS.txt \
            -- "$RELEASE_TAG"
          cd "$assets_dir"
          test -s "$INSTALLER"
          test -s "$ARCHIVE"
          test -s SHA256SUMS.txt
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict

      - name: Install rclone
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive=rclone-v1.76.0-linux-amd64.zip
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://downloads.rclone.org/v1.76.0/$archive"
          echo "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7  $archive" | sha256sum --check
          unzip -q "$archive"
          echo "$RUNNER_TEMP/${archive%.zip}" >> "$GITHUB_PATH"

      - name: Copy release assets to Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [[ -z "$RCLONE_CONFIG_CONTENT" ]]; then
            echo '::error::The RCLONE_CONFIG Actions secret must contain an authorized [gdrive] remote.'
            exit 1
          fi

          config_path=$(mktemp "$RUNNER_TEMP/rclone.XXXXXX")
          trap 'rm -f -- "$config_path"' EXIT
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$config_path"
          unset RCLONE_CONFIG_CONTENT

          rclone --config "$config_path" copy --checksum --log-level INFO \
            "$RUNNER_TEMP/release-assets" "gdrive:RoveBrowser/releases/$RELEASE_TAG"
