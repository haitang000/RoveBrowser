name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer and portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        # Keep release builds on the compiler used for native/installer validation.
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          $archive = "$toolRoot.zip"
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $archive
          $expectedHash = 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup package checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot -Force
          $compiler = Join-Path $toolRoot 'tools\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe not found.' }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run installer
        env:
          CARGO_TERM_COLOR: always

      - name: Package portable zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ExecutablePath native/target/x86_64-pc-windows-msvc/release/rove.exe

      - name: Upload installer and zip to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release -Filter *.zip)
          $installers = @(Get-ChildItem -LiteralPath release -Filter *-setup.exe)
          if ($archives.Count -ne 1 -or $installers.Count -ne 1) {
            throw "Expected one zip and one installer, found $($archives.Count) and $($installers.Count)."
          }
          foreach ($artifact in @($archives[0], $installers[0])) {
            if ($artifact.Length -le 0) { throw "Release artifact is empty: $($artifact.FullName)" }
          }
          gh release upload $env:RELEASE_TAG $archives[0].FullName $installers[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
