workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify
  - native

frontend:
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  script:
    - npm ci --prefer-offline
    - npm test
    - npm run build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-dist"
    paths:
      - dist/
    expire_in: 1 week

# 需要 GitLab Windows Shell Runner，标签为 windows，并安装 Rust MSVC、
# Visual Studio C++ Build Tools 和 Windows SDK。该任务下载上一步生成的 dist。
windows-native:
  stage: native
  tags:
    - windows
  needs:
    - job: frontend
      artifacts: true
  variables:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-C target-feature=+crt-static"
  script:
    - rustc --version
    - cargo --version
    - cargo test --manifest-path native/Cargo.toml --locked --target x86_64-pc-windows-msvc -- --test-threads=1
    - cargo build --manifest-path native/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-windows-x64"
    paths:
      - native/target/x86_64-pc-windows-msvc/release/rove.exe
    expire_in: 1 week
